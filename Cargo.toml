[package]
name = "l0-cache"
version = "0.1.0"
edition = "2021"
description = "Lightweight CLI proxy that reduces LLM token consumption via universal output filtering"
license = "MIT"
keywords = ["cli", "proxy", "llm", "token", "filter"]
categories = ["command-line-utilities"]

[[bin]]
name = "l0-cache"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
strip = true
