name: Release binaries

# On every version tag, build prebuilt binaries and attach them (plus SHA-256
# checksums) to the GitHub Release, so users can install without a Rust toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package + checksum
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/l0-cache"
          art="l0-cache-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$art" l0-cache
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$art" > "$art.sha256"
          else
            shasum -a 256 "$art" > "$art.sha256"
          fi

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            l0-cache-${{ matrix.target }}.tar.gz
            l0-cache-${{ matrix.target }}.tar.gz.sha256
