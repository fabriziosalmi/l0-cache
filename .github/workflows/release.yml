name: Release binaries

# On every version tag, build prebuilt binaries and attach them (plus SHA-256
# checksums) to the GitHub Release, so users can install without a Rust toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Serialize the matrix so the three `softprops/action-gh-release@v2`
    # invocations don't race each other on release creation — that race
    # produced a duplicate draft + an HTTP 401 when v0.1.10 was tagged.
    # `max-parallel: 1` runs the matrix legs one at a time natively.
    # (The previous job-level `concurrency` group also serialized, but a
    # GitHub concurrency group holds at most ONE pending job — with a 3-leg
    # matrix the third leg got CANCELLED, dropping the x86_64-apple asset
    # from the v0.1.11 release until a manual re-run.)
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package + checksum (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/l0-compressor"
          art="l0-compressor-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$art" l0-compressor
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$art" > "$art.sha256"
          else
            shasum -a 256 "$art" > "$art.sha256"
          fi

      - name: Package + checksum (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/l0-compressor.exe"
          $art = "l0-compressor-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $art
          $hash = (Get-FileHash -Algorithm SHA256 $art).Hash.ToLower()
          "$hash  $art" | Out-File -Encoding ascii "$art.sha256"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            l0-compressor-${{ matrix.target }}.tar.gz
            l0-compressor-${{ matrix.target }}.tar.gz.sha256
            l0-compressor-${{ matrix.target }}.zip
            l0-compressor-${{ matrix.target }}.zip.sha256
