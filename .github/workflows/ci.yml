name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Run Test Suite (Unit & E2E)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: Installer Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax & lint (bash -n + shellcheck)
        run: |
          bash -n install.sh
          shellcheck install.sh || true   # advisory; do not fail the build on style

      - name: Regression — empty ARGS must expand to ZERO words (curl | bash no-op bug)
        run: |
          set -u
          ARGS=()
          set -- "${ARGS[@]+"${ARGS[@]}"}"
          test "$#" -eq 0 || { echo "empty-array expansion injected $# arg(s)"; exit 1; }

      - name: Smoke — dry-run install path parses & runs
        run: bash install.sh --dry-run
