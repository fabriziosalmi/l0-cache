name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test & Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Release build (exercises opt-level=z / lto / strip)
        run: cargo build --release

      - name: Smoke-run the release binary
        run: ./target/release/l0-compressor --no-auto echo "ci-smoke" | grep -q ci-smoke

  windows:
    name: Windows Build & Native Smoke
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests (unit; E2E suite is unix-gated)
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Smoke — native spawn, filtering, stderr merge, exit codes
        shell: cmd
        run: |
          target\release\l0-compressor.exe --no-auto cargo --version | findstr /C:"cargo" || exit /b 1
          target\release\l0-compressor.exe --no-auto --threshold 10 --head 5 --tail 5 cargo tree | findstr /C:"omitted for LLM" || exit /b 1
          target\release\l0-compressor.exe --no-auto cmd /C "echo tostderr 1>&2" | findstr /C:"tostderr" || exit /b 1
          target\release\l0-compressor.exe --no-auto cmd /C "exit 7"
          if %errorlevel% neq 7 exit /b 1
          target\release\l0-compressor.exe --stats

  msrv:
    name: Minimum Supported Rust (1.85)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The floor is driven by dependencies, not our code: clap 4.6 requires the
      # edition2024 cargo feature, stabilized in Rust 1.85.
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo check (build, not tests)
        run: cargo check

  musl:
    name: Static musl Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify it is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/l0-compressor
          ldd target/x86_64-unknown-linux-musl/release/l0-compressor || true

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: Installer Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax & lint (bash -n + shellcheck)
        run: |
          bash -n install.sh
          bash -n claude-hook.sh
          shellcheck install.sh || true        # advisory; do not fail the build on style
          shellcheck -S error claude-hook.sh    # claude-hook.sh must be error-clean

      - name: Regression — empty ARGS must expand to ZERO words (curl | bash no-op bug)
        run: |
          set -u
          ARGS=()
          set -- "${ARGS[@]+"${ARGS[@]}"}"
          test "$#" -eq 0 || { echo "empty-array expansion injected $# arg(s)"; exit 1; }

      - name: Smoke — dry-run install path parses & runs
        run: bash install.sh --dry-run
